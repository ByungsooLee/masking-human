name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_LIVE_TEST: "0"
      SUPABASE_INTEGRATION_TEST: "0"
      VOICE_LIVE_TEST: "0"
      NEXT_PUBLIC_LIVE_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
